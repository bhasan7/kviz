<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#182235;--muted:#6b7280;--blue:#2563eb;--green:#15803d;--red:#b91c1c;--line:#dbe3ef}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:28px 16px 50px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
h1{margin:0;font-size:38px} .muted{color:var(--muted)} .stats{display:flex;gap:9px;flex-wrap:wrap}
.badge{background:#eaf1ff;color:#1746a2;border-radius:999px;padding:8px 12px;font-weight:750}
.progress{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:18px 0}
#bar{height:100%;background:var(--blue);width:0;transition:.2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
.kicker{font-size:13px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.06em}
.q{font-size:25px;font-weight:800;line-height:1.35;margin:9px 0 20px}
.note{font-size:14px;color:var(--muted);margin:-8px 0 14px}
.opts{display:grid;gap:11px}
.opt{display:flex;gap:11px;width:100%;text-align:left;border:2px solid var(--line);background:#fff;padding:14px;border-radius:13px;font-size:16px;cursor:pointer}
.opt:hover{border-color:#9db8ff} .opt.sel{background:#eff6ff;border-color:var(--blue)}
.opt.good{background:#f0fdf4;border-color:#4ade80;color:#14532d} .opt.bad{background:#fef2f2;border-color:#f87171;color:#7f1d1d}
.letter{font-weight:900;min-width:24px} .feedback{display:none;margin-top:16px;padding:14px;border-radius:12px}
.feedback.good{display:block;background:#ecfdf3;color:#166534} .feedback.bad{display:block;background:#fff1f2;color:#9f1239}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.action{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}
#check{background:var(--blue);color:white} #next{background:#111827;color:#fff;display:none}
.result{text-align:center;padding:35px 15px} .big{font-size:52px;font-weight:900;color:var(--blue)}
@media(max-width:600px){h1{font-size:30px}.q{font-size:21px}.card{padding:18px}}
</style>
</head>

t": ["Osebnost."], "source": "checked"}, {"q": "Katera izmed konceptualizacij se ukvarja s transferjem v odnosih in pomenom zgodnjih prepričanj?", "options": ["psihodinamične", "humanistične", "VKT", "sistemske"], "correct": ["psihodinamične"], "source": "checked"}, {"q": "Kaj je v Sloveniji pogoj za psihologa za delo v zdravstvu?", "options": ["Specializacija iz KP", "Opravljen zdravstveni izpit in končano pripravništvo iz KP.", "EuroPsy certifikat."], "correct": ["Opravljen zdravstveni izpit in končano pripravništvo iz KP."], "source": "checked"}, {"q": "Nekej z ICF, v smislu, na katerem področju se uporablja?", "options": ["Rehabilitacija.", "forenzična", "zdravstvena", "psihoterapija"], "correct": ["Rehabilitacija."], "source": "checked"}, {"q": "Ali je del klinično psihološkega intervjuja tudi opazovanje?", "options": ["Da, ker lahko tako dobimo informacije pomembne za obravnavo.", "Ne, opazovanje je posebna oblika metode.", "Da, samo če to zajema napotno vprašanje."], "correct": ["Da, ker lahko tako dobimo informacije pomembne za obravnavo."], "source": "checked"}, {"q": "Katera izmed stopenj formalizacije se od ostalih loči po teoretični specifičnosti?", "options": ["Razlaga in razumevanje patogeneze.", "Pridobivanje podatkov."], "correct": ["Razlaga in razumevanje patogeneze."], "source": "checked"}, {"q": "Katera stopnja razvoja VKT združuje VKT in humanistične konceptualizacije?", "options": ["Prva (Behaviorizem).", "Druga (Kognitivna?).", "Tretja ().", "nobena"], "correct": ["Tretja ()."], "source": "checked"}, {"q": "Kaj je spodbudilo vključitev psihoterapije v klinično psihologijo?", "options": ["Porast števila travmatiziranih ljudi po drugi svetovni vojni", "prva svetovna vojna", "Potreba po teoretični podpori klinične psihologije (prbližno)"], "correct": ["Porast števila travmatiziranih ljudi po drugi svetovni vojni"], "source": "checked"}, {"q": "O čem govori Luksemburška izjava?", "options": ["O izobraževanju in licenciranju psihologov.", "O razmerju med teoretičnim delom-raziskovanjem alneki in aplikacijo.", "Zagotavlja, da lahko vsak psiholog certifikarom EuroPsy dela v EU."], "correct": ["O izobraževanju in licenciranju psihologov."], "source": "checked"}, {"q": "Kateri učinek intervencij govori o velikosti spremembe in tudi, ali je oseba ozdravljena?", "options": ["klinična pomembnost", "praktična", "statistična"], "correct": ["klinična pomembnost"], "source": "checked"}, {"q": "Teorije / konceptualizacije? so se razvile v smeri:", "options": ["od kulturno univerzalnih h kulturno specifičnim", "od intrapersonalnih k odnosnim", "od metateoretičnih k monoteoretskim."], "correct": ["od intrapersonalnih k odnosnim"], "source": "checked"}, {"q": "Ali je prav, da pacient/klient sodeluje pri formulaciji obravnave?", "options": ["Da, ker je to v pacientovih pravicah.", "Ne, ker je psiholog strokovnjak in odgovoren za svoja dejanja/odločitve.", "Da, ker je to del psihoterapevtskega pristopa."], "correct": ["Da, ker je to v pacientovih pravicah."], "source": "checked"}, {"q": "Kako obsežna je obravnava?", "options": ["Zajema celotna znanja psihologa", "tako da odgovori na napotno vprašanje", "tako kot je pacient zmožen sodelovati"], "correct": ["tako da odgovori na napotno vprašanje"], "source": "checked"}, {"q": "Katera doktrina je najboljša?", "options": ["Tista, ki da poudarek tako na znanost kot na klinično prakso", "tista ki da poudarek na prakso", "na znanost"], "correct": ["Tista, ki da poudarek tako na znanost kot na klinično prakso"], "source": "checked"}];
let order=[...Array(quizData.length).keys()];
let current=0, score=0, selected=new Set(), wrong=[];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
shuffle(order);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]);
function sameSet(a,b){return a.size===b.size && [...a].every(x=>b.has(x))}
function render(){
 if(current>=order.length) return result();
 const item=quizData[order[current]], opts=shuffle([...item.options]);
 selected=new Set();
 document.getElementById('counter').textContent=`Vprašanje ${current+1} / ${order.length}`;
 document.getElementById('score').textContent=`Točke: ${score}`;
 document.getElementById('bar').style.width=`${100*current/order.length}%`;
 const multi=item.correct.length>1;
 document.getElementById('app').innerHTML=`
 <div class="card">
  <div class="kicker">Vprašanje ${current+1}</div>
  <div class="q">${esc(item.q)}</div>
  ${multi?`<div class="note">Izberi ${item.correct.length} pravilne odgovore.</div>`:''}
  <div class="opts">${opts.map((o,i)=>`<button class="opt" data-v="${esc(o)}"><span class="letter">${String.fromCharCode(65+i)}.</span><span>${esc(o)}</span></button>`).join('')}</div>
  <div id="fb" class="feedback"></div>
  <div class="actions"><button id="check" class="action">Preveri odgovor</button><button id="next" class="action">Naslednje vprašanje</button></div>
 </div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const v=b.dataset.v;
   if(multi){selected.has(v)?selected.delete(v):selected.add(v);b.classList.toggle('sel')}
   else{selected.clear();selected.add(v);document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
 });
 document.getElementById('check').onclick=check;
 document.getElementById('next').onclick=()=>{current++;render()};
}
function check(){
 if(!selected.size)return;
 const item=quizData[order[current]], correct=new Set(item.correct);
 const ok=sameSet(selected,correct);
 if(ok)score++; else wrong.push(order[current]);
 document.querySelectorAll('.opt').forEach(b=>{
   const v=b.dataset.v;
   if(correct.has(v))b.classList.add('good');
   else if(selected.has(v))b.classList.add('bad');
   b.disabled=true;
 });
 const fb=document.getElementById('fb');
 fb.className='feedback '+(ok?'good':'bad');
 fb.innerHTML=ok?'<b>Pravilno.</b>':`<b>Napačno.</b> Pravilen odgovor: <b>${item.correct.map(esc).join(' + ')}</b>`;
 document.getElementById('check').style.display='none';
 document.getElementById('next').style.display='inline-block';
 document.getElementById('score').textContent=`Točke: ${score}`;
}
function result(){
 document.getElementById('bar').style.width='100%';
 document.getElementById('counter').textContent='Konec';
 const pct=Math.round(100*score/order.length);
 document.getElementById('app').innerHTML=`<div class="card result"><h2>Rezultat</h2><div class="big">${score} / ${order.length}</div><p class="muted">${pct} % pravilnih odgovorov</p><div class="actions" style="justify-content:center"><button class="action" id="all">Ponovi celoten kviz</button>${wrong.length?'<button class="action" id="retry" style="background:#111827;color:#fff">Ponovi napačna</button>':''}</div></div>`;
 document.getElementById('all').onclick=()=>{order=[...Array(quizData.length).keys()];shuffle(order);current=0;score=0;wrong=[];render()};
 if(wrong.length)document.getElementById('retry').onclick=()=>{order=[...new Set(wrong)];shuffle(order);current=0;score=0;wrong=[];render()};
}
render();
</script>
